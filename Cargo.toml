[package]
name = "ray-tracer-rust"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = "0.35.0"
embedded-graphics = "0.8"
# The hardware-accelerated pixel buffer
pixels = "0.13.0"
rayon = "1.12.0"

# Window creation and event handling (pinned to 0.29 for the loop style used above)
winit = { version = "0.29.15", features = ["rwh_05"] }

# Ray tracing is pure number-crunching: unoptimized builds run ~45x slower (55+ s per frame),
# so optimize debug builds too. Debug info and debug assertions are kept.
[profile.dev]
opt-level = 2
